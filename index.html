<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoportal São José dos Campos</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo_CostaSilva_final.png">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- Sidebar -->
        <div id="sidebar">
            <div class="sidebar-header">
                <img src="logo_CostaSilva_final.png" alt="Logo Costa Silva" class="logo">
                <h2>Geoportal São José dos Campos</h2>
            </div>
            
            <div class="sidebar-section">
                <h3>Mapas de Fundo</h3>
                <div id="basemap-select" style="display: flex; gap: 15px; font-size: 0.85rem; align-items: center; flex-wrap: wrap;">
                    <label style="cursor:pointer;"><input type="radio" name="basemap" value="osm"> OpenStreetMap</label>
                    <label style="cursor:pointer;"><input type="radio" name="basemap" value="satellite"> Satélite</label>
                    <label style="cursor:pointer;"><input type="radio" name="basemap" value="carto"> Esri Claro</label>
                    <label style="cursor:pointer;"><input type="radio" name="basemap" value="dark" checked> Modo Dark</label>
                </div>
            </div>

            <div class="sidebar-section">
                <h3>Pesquisar Município</h3>
                <div style="display: flex; gap: 5px; margin-bottom: 15px;">
                    <input type="text" id="search-mun" placeholder="Digite o nome do município..." style="flex-grow: 1; padding: 6px; border: 1px solid var(--border-color); border-radius: 4px;">
                    <button id="btn-search" style="padding: 6px 12px; background-color: var(--accent-color); color: white; border: none; border-radius: 4px; cursor: pointer;"><i class="fas fa-search"></i></button>
                </div>

                <h3>Pesquisar Imóvel CAR</h3>
                <div style="display: flex; gap: 5px; margin-bottom: 15px;">
                    <input type="text" id="search-imovel" placeholder="Digite o cod_imovel..." style="flex-grow: 1; padding: 6px; border: 1px solid var(--border-color); border-radius: 4px;">
                    <button id="btn-search-imovel" style="padding: 6px 12px; background-color: var(--accent-color); color: white; border: none; border-radius: 4px; cursor: pointer;"><i class="fas fa-search"></i></button>
                </div>

                <h3>Camadas</h3>
                <p class="help-text">Arraste para reordenar. Selecione a camada (botão) para obter informações ao clicar no mapa.</p>
                <button id="toggle-all-layers" style="width:100%; padding:5px; margin-bottom:10px; cursor:pointer; background-color: var(--accent-color); color: white; border: none; border-radius: 4px;">Ativar/Desativar Todas</button>
                <div class="layer-list-header">
                    <span title="Visibilidade" class="col-vis"><i class="fas fa-eye"></i></span>
                    <span title="Selecionar para Informações" class="col-info"><i class="fas fa-mouse-pointer"></i></span>
                    <span class="col-name">Nome da Camada</span>
                </div>
                <ul id="layer-list">
                    <!-- Layer items will be generated dynamically via JS -->
                </ul>
            </div>

            <!-- New Legend and Stats Section -->
            <div class="sidebar-section" id="sidebar-legend-section" style="display: none;">
                <h3>Estatísticas e Legenda (Imóvel CAR)</h3>
                <div id="sidebar-legend-content" style="font-size: 0.85rem; margin-top: 10px;">
                    <!-- Filled dynamically -->
                </div>
            </div>
        </div>
        
        <!-- Map Container -->
        <div id="map">
            <img src="logo_CostaSilva_final.png" alt="Marca d'água" id="watermark">
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- SortableJS for Drag and Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <!-- Turf.js for Area Calculation -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    
    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
